<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach the notch, which is what makes
         the env(safe-area-inset-*) values used throughout the CSS resolve to
         something other than zero on iOS. Zooming stays allowed on purpose:
         pinch-zoom is an accessibility feature, and form fields are sized to
         16px on mobile so focusing one never triggers the iOS zoom anyway. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <!-- Installability: the manifest plus the 192/512 icons is what makes the
         browser offer "Install app" / "Add to Home Screen". No service worker
         is required for that since Chrome 108/112. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Google Search Console ownership, HTML-tag method. The token differs
         from the one in public/google3143a134740cc9d9.html, which is the HTML
         file method - either satisfies the check, both are kept so a change to
         one does not break verification. -->
    <meta name="google-site-verification" content="4Vkz3M7uaNoSiB3ofa7N_l6QBCiFbuzHfbBh-uOi7vc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DTS" />

    <!-- Everything between the markers is generated per route at build time by
         scripts/prerender.mjs, from the single ROUTES table in src/seo.js. What
         sits here is the homepage's own metadata, which is also what a dev
         server and the SPA fallback serve. Do not hand-edit these tags: add a
         route to src/seo.js instead. -->
    <!--prerender:head-->
    <title>DTS Rwanda | Digital Technology Skills</title>
    <meta name="description" content="Computer training in Huye, Rwanda - hands-on courses in Microsoft Office, Google services, graphic design and digital literacy at UR-Huye Campus since 2022." />
    <link rel="canonical" href="https://dtsrw.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DTS Rwanda" />
    <meta property="og:title" content="DTS Rwanda | Digital Technology Skills" />
    <meta property="og:description" content="Hands-on technology training and digital literacy at UR-Huye Campus, since 2022." />
    <meta property="og:url" content="https://dtsrw.vercel.app/" />
    <meta property="og:image" content="https://dtsrw.vercel.app/og-dts-team-activity.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DTS team activity at UR-Huye Campus" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DTS Rwanda | Digital Technology Skills" />
    <meta name="twitter:description" content="Hands-on technology training and digital literacy at UR-Huye Campus, since 2022." />
    <meta name="twitter:image" content="https://dtsrw.vercel.app/og-dts-team-activity.jpg" />
    <!--/prerender:head-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the stylesheet actually uses (300 is never referenced).
         Each extra weight is another font file the browser has to fetch. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- The hero photo is the largest paint on the landing page, but React only
         applies it after the JS runs. Preloading starts the download alongside
         the CSS and JS instead of after them. -->
    <link rel="preload" as="image" href="/hero-1.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
